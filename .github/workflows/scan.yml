name: Scan

# Workflow pembanding kerentanan. Dia BUKAN salah satu status check wajib (go/web/api/pdf ada di
# ci.yml, dan ci.yml sengaja tidak memasang `paths:` karena check yang di-skip mengunci PR dengan
# branch protection). Di sini `paths:` justru aman dan perlu: tidak ada alasan menjalankan
# `npm ci` + `govulncheck` untuk perubahan README.
#
# `schedule` ada karena kerentanan terbit tanpa ada yang menyentuh kode: angka di
# tools/ci/vuln-baseline.json berasal dari basis-data advisori GitHub pada hari ia diukur (lihat
# kunci `diukur`), bukan dari commit kita. Tanpa jadwal, temuan baru tidak akan terlihat sampai ada
# PR yang kebetulan mengubah lockfile.
#
# Dua hal yang membuat angkanya berarti: govulncheck jalan di DALAM image golang yang di-pin di
# go-backend/Dockerfile (bukan toolchain runner — lihat langkah scan di bawah), dan npm audit
# dibatasi --omit=dev. Yang dibandingkan adalah apa yang di-deploy, bukan apa yang kebetulan
# terpasang di mesin build.
#
# Batas yang perlu diketahui sejak awal: cron GitHub HANYA dijalankan dari branch default. Jadi
# sebelum PR ini mendarat di main, jadwalnya belum aktif — dan kalau nanti ada PR yang mengubah
# daftar baseline, yang memvalidasinya adalah trigger `pull_request` di bawah, bukan cron.
#
# Merah di sini berarti "ada temuan yang belum pernah diputuskan", bukan "ada kerentanan".
# Perbedaannya penting: yang kedua sudah benar sejak workflow ini ditulis.

on:
  schedule:
    - cron: "17 3 * * 1" # Senin ~03:17 UTC, jam kerja WIB siang
  workflow_dispatch:
  pull_request:
    paths:
      - "nextjs-frontend/package.json"
      - "nextjs-frontend/package-lock.json"
      - "go-backend/go.mod"
      - "go-backend/go.sum"
      # govulncheck sekarang berjalan di dalam image yang disebut file ini: ganti versi atau
      # digest = ganti toolchain = ganti angkanya. Scan wajib ikut jalan.
      - "go-backend/Dockerfile"
      - "tools/ci/vuln-baseline.json"
      - "tools/ci/vuln-check.mjs"
      - ".github/workflows/scan.yml"

permissions:
  contents: read

concurrency:
  group: scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vuln:
    name: vuln
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.3

      - name: Baca versi Node dari image produksi
        id: node-base
        run: |
          # Sama seperti job web di ci.yml: angka dibaca dari Dockerfile, tidak dikunci di sini,
          # supaya `npm ci` + `npm audit` dijalankan pada runtime yang benar-benar di-deploy.
          v=$(sed -n 's|^FROM node:\([0-9][0-9]*\)-alpine.*|\1|p' nextjs-frontend/Dockerfile | head -n1)
          [ -n "$v" ] || { echo "tidak menemukan FROM node:<major>-alpine di nextjs-frontend/Dockerfile"; exit 1; }
          echo "versi=$v" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.node-base.outputs.versi }}
          cache: npm
          cache-dependency-path: nextjs-frontend/package-lock.json

      - name: Baca image Go dari Dockerfile produksi
        id: go-base
        run: |
          img=$(sed -n 's|^FROM \(golang:[^ ]*\).*|\1|p' go-backend/Dockerfile | head -n1)
          [ -n "$img" ] || { echo "tidak menemukan FROM golang:... di go-backend/Dockerfile"; exit 1; }
          # Digest wajib. Tanpa pin, "image yang sama dengan produksi" cuma klaim: tag bergerak bisa
          # berjarak satu minor dari yang benar-benar dibangun dan di-deploy.
          case "$img" in
            *@sha256:*) ;;
            *) echo "FROM golang harus di-pin digest, yang terbaca: $img"; exit 1 ;;
          esac
          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "scan akan berjalan di dalam $img"

      - name: npm audit — hanya dependensi produksi
        working-directory: nextjs-frontend
        run: |
          npm ci
          # --omit=dev: yang di-deploy ke Cloud Run adalah image produksi. Diukur 2026-10-06:
          # produksi = 15 paket terdampak (0 low, 2 moderate, 12 high, 1 critical); seluruh pohon
          # termasuk dev = 26 (1 low, 3 moderate, 21 high, 1 critical). Yang dibandingkan baseline
          # adalah ID GHSA-nya, dan produksi saja menyumbang 60 ID unik pada 12 paket — metadata npm
          # menghitung paket terdampak, bukan banyaknya advisori.
          # `|| true` BUKAN penyembunyian: npm keluar nonzero kalau ada temuan apa pun, dan hari ini
          # memang ada. Keputusan merah/hijau pindah ke perbandingan baseline di langkah terakhir;
          # langkah ini hanya menjamin berkasnya ada dan berbentuk benar.
          npm audit --omit=dev --json > /tmp/audit.json || true
          # Bentuknya yang menjaga, bukan rc npm: tanpa dua assert di bawah, audit yang MATI (endpoint
          # advisori tidak terjangkau -> npm mencetak objek error tanpa .vulnerabilities, atau stdout
          # kosong) akan terbaca sebagai "nol temuan, hijau". Sekarang dia merah.
          jq -e '.vulnerabilities | type=="object"' /tmp/audit.json > /dev/null
          jq -e '.metadata.vulnerabilities | has("total")' /tmp/audit.json > /dev/null
          jq -r '"audit produksi: \(.metadata.vulnerabilities | to_entries | map("\(.key)=\(.value)") | join(" "))"' /tmp/audit.json

      - name: govulncheck — di dalam image yang di-deploy
        run: |
          # govulncheck melaporkan stdlib dari toolchain yang MENJALANKANNYA, bukan dari image kita.
          # Diukur 2026-10-12: dengan `go-version-file: go-backend/go.mod` (PR #48 baru menaikkan
          # direktifnya ke go 1.26.0) runner melapor 26 temuan "terpanggil", dan 22 di antaranya
          # stdlib go1.26 — GO-2026-6617 mencetak "Found in: net/http@go1.26, Fixed in: go1.26.9" —
          # sementara image produksi (golang:1.27-alpine, go1.27.2) hanya punya 4. Tripwire itu
          # mengukur kerentanan alat build CI, bukan kerentanan yang di-deploy, dan angkanya
          # menyewa perhatian untuk hal yang salah.
          # Yang dijalankan sekarang image-nya sendiri, jadi tidak ada lagi tebakan versi:
          # GOTOOLCHAIN=local menutup jalan keluar — kalau go.mod menuntut lebih baru dari image
          # ini, scan mati merah, bukan diam-diam mengunduh toolchain lain lalu memindai itu.
          # rc-nya tetap bukan vonis (3 = ada temuan terpanggil); keluarannya yang dibandingkan.
          docker run --rm \
            -v "$GITHUB_WORKSPACE/go-backend:/app:ro" -w /app \
            -e GOTOOLCHAIN=local -e GOCACHE=/tmp/gocache -e GOMODCACHE=/tmp/gomod -e GOPATH=/tmp/gopath \
            "${{ steps.go-base.outputs.image }}" \
            sh -c 'go run golang.org/x/vuln/cmd/govulncheck@latest ./...' > /tmp/govuln.txt 2>&1 || true
          n=$(grep -c '^Vulnerability #' /tmp/govuln.txt || true)
          echo "govulncheck (${{ steps.go-base.outputs.image }}): $n kerentanan terpanggil, id: $(grep -oE 'GO-[0-9]{4}-[0-9]+' /tmp/govuln.txt | sort -u | tr '\n' ' ')"
          # Ketiadaan sama sekali Blok Symbol bisa berarti "bersih" ATAU "scan mati di tengah jalan".
          # Yang kedua tidak boleh lolos jadi hijau; grep di bawah memastikan berkasnya memang keluaran
          # govulncheck, bukan kosong karena gagal unduh modul.
          grep -Eq 'Symbol Results|No vulnerabilities found|==== Symbol Results ====' /tmp/govuln.txt || {
            echo "keluaran govulncheck tidak dikenali; 20 baris pertama:"
            head -20 /tmp/govuln.txt
            exit 1
          }

      - name: Bandingkan dengan baseline
        run: node tools/ci/vuln-check.mjs --govuln=/tmp/govuln.txt --audit=/tmp/audit.json

      - name: Ringkasan saat gagal
        if: failure()
        run: |
          echo "=== govulncheck (blok simbol) ==="
          sed -n '/Symbol Results/,$p' /tmp/govuln.txt 2>/dev/null | head -40 || true
          echo "=== npm audit (ringkasan) ==="
          jq -r '.metadata.vulnerabilities' /tmp/audit.json 2>/dev/null || true
          echo "=== baseline ==="
          jq -c '{go: (.go|length), npm: (.npm|length), diukur}' tools/ci/vuln-baseline.json 2>/dev/null || true
          echo "Regenerasi sadar kalau pergeserannya memang kamu setujui:"
          echo "  node tools/ci/vuln-check.mjs --govuln=<file> --audit=<file> --emit-baseline"
