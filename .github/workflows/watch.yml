name: Watch

# P6 — jendela observasi. Bukan gerbang: tidak ada satu pun merge yang menunggu workflow ini.
# Tugasnya hanya satu — membuktikan klaim "produksi stabil" setiap hari dengan angka, dan
# meninggalkan satu baris di riwayat run. Run merah adalah alarmnya; GitHub mengirim notifikasi
# default untuk workflow terjadwal yang gagal, dan itu cukup untuk satu operator.
#
# Sengaja TIDAK ada `issues: write`. Membuat issue otomatis adalah keputusan pemilik repo
# (TODO.md §6 butir 5) dan workflow ini berjalan tanpa ulasan manusia, jadi setiap issue yang
# dihasilkannya adalah efek samping yang tidak bisa dibatalkan sebelum terjadi.
#
# Kredensial cloud yang dipegang workflow ini hanya satu, dan hanya baca: identitas WIF
# `github-watch@…` yang perannya `roles/run.viewer` di projek ini saja — tidak ada
# `secretmanager.secretAccessor`, tidak ada write. Itu diperlukan karena satu pertanyaan tidak
# bisa dijawab dari riwayat run GitHub: "traffic sekarang ada di revisi mana". Deploy hijau tidak
# membuktikannya — run #16 (2026-10-04) adalah contohnya: `portfolio-be-00012-4zs` dibuat dan
# sehat sementara 100% traffic masih di `00011-5z8`, dan smoke test tetap hijau karena yang
# di-probe URL layanan, bukan revisi yang melayani. Yang itu hanya terlihat di `status.traffic`.
# Perbandingan jujur: deploy.yml sudah memeriksa `cloudrun.sh serving` di dalam run-nya sendiri,
# jadi ia melindunginya pada saat deploy. Yang Watch tambahkan adalah bukti bahwa itu MASIH benar
# di hari ketika tidak ada satu pun deploy berjalan.
#
# Batas yang sengaja tidak dilewati: workflow terjadwal berjalan tanpa ulasan manusia, jadi
# identitasnya harus tidak bisa mengubah apa pun. Kalau nanti butuh lebih (mis. membaca log atau
# revisi di projek lain), itu keputusan pemilik repo, bukan default yang boleh diam-diam melebar.
# Kegagalan membaca cloud dicatat KUNING, bukan MERAH — yang merah adalah produksinya, bukan
# aksesorinya — dan KUNING berarti terbaca di rangkuman, tidak pernah senyap.
#
# Dua kredensial, dua nasib berbeda: GITHUB_TOKEN bawaan run (scope-nya persis `permissions:` di
# atas, read-only, mati sendiri saat run selesai) yang dipasang runner sebagai GH_TOKEN — lihat
# env di job — dan token akses cloud dari langkah WIF, yang umur maksimalnya satu jam dan tidak
# ditulis ke mana-mana.

on:
  schedule:
    - cron: "37 2 * * *" # 02:37 UTC; menit ganjil supaya tidak sekalian dengan jam penuh
  workflow_dispatch:

permissions:
  contents: read
  actions: read # hanya untuk membaca riwayat run deploy.yml (cek drift)
  id-token: write # hanya untuk menukarkan token WIF jadi identitas BACA di bawah (roles/run.viewer)

concurrency:
  group: watch-production
  cancel-in-progress: false

env:
  PROJECT_ID: config-agentic-ubuntu
  REGION: us-central1
  WIF_PROVIDER: projects/486641216758/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  # Identitas read-only workflow ini. Binding WIF-nya `principalSet://…/attribute.repository/
  # ArkanFzi/website-porto2`, jadi cuma repo ini yang bisa menukarnya, dan peran yang bisa
  # dihasilkannya cuma run.viewer.
  WATCH_SA: github-watch@config-agentic-ubuntu.iam.gserviceaccount.com
  # Invarian yang dijaga langkah cloud-drift: kedua service HARUS berjalan di SA runtime
  # least-privilege ini (F5). Kalau suatu hari ada yang deploy manual tanpa --service-account,
  # field ini kembali ke default compute SA yang memegang roles/editor — dan itu harus kelihatan.
  RUNTIME_SA: portfolio-runtime@config-agentic-ubuntu.iam.gserviceaccount.com
  DOMAIN: https://arkfazone-portofolio.elarisnoir.my.id
  BE_URL: https://portfolio-be-486641216758.us-central1.run.app
  FE_URL: https://portfolio-fe-486641216758.us-central1.run.app
  BE_SERVICE: portfolio-be
  FE_SERVICE: portfolio-fe
  BRANCH_LAYU_JAM: 168 # 7 hari

jobs:
  watch:
    name: probe + drift harian
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Runner ubuntu-latest memasang `gh`, tapi menolak pakai kredensial bawaannya kalau
      # GH_TOKEN belum di-set: `gh api` langsung keluar dengan pesan "set the GH_TOKEN
      # environment variable" dan stderr itu yang membuat langkah drift menulis MERAH pada
      # run pertama workflow ini di runner (2026-10-04 17:27 UTC). token di sini adalah
      # GITHUB_TOKEN milik repo dengan scope persis seperti `permissions:` di atas — untuk
      # GitHub tetap read-only. Kredensial cloud-nya terpisah, lewat langkah WIF di bawah,
      # dan tidak bisa dipakai untuk menulis apa pun.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.3
        with:
          # fetch-depth: 0 — cek drift butuh riwayat first-parent, dan .git repo ini 8 MB.
          fetch-depth: 0

      # continue-on-error: SENGAJA. Kalau identitas baca ini rusak (binding WIF tercabut, SA
      # nonaktif, penerbitan token gagal), yang benar adalah KUNING "cloud tidak terbaca" di
      # rangkuman, bukan run merah yang menyerupai produksi rusak. Langkah berikutnya tidak
      # menutupi ini: setiap titik gagal menulis vonisnya sendiri-sendiri.
      - name: Authenticate read-only ke Google Cloud via WIF
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WATCH_SA }}
          token_format: access_token

      # Semua langkah di bawah menulis vonisnya ke /tmp/hasil.tsv dan TIDAK pernah exit 1 sendiri.
      # Itu sengaja: baris harian harus tetap tertulis walaupun sebuah probe merah. Yang membuat
      # run gagal adalah langkah terakhir, setelah rangkuman tercetak.
      - name: Probe konten (domain publik + run.app)
        run: |
          # `set +e` bukan kosmetik. Reheksal lokal dengan server rusak (200 + `null` untuk
          # /api/certificates) membuktikan bahwa di bawah `bash -e` langkah ini mati di probe
          # kedua, dan baris hariannya hilang sebagian — yaitu kegagalan yang paling tidak
          # kamu inginkan tepat saat produksi sedang rusak. Vonis ditulis eksplisit HIJAU/MERAH,
          # jadi tidak ada yang perlu menghentikan script.
          set +e
          echo "komponen|status|detail" > /tmp/hasil.tsv

          vonis() { echo "$1|$2|$3" >> /tmp/hasil.tsv; }

          for target in "domain=$DOMAIN" "be-runapp=$BE_URL" "fe-runapp=$FE_URL"; do
            label="${target%%=*}"; base="${target#*=}"

            : > /tmp/h
            t=$(curl -fsS --max-time 45 -o /tmp/h -w '%{time_total}' "$base/api/health" 2>/dev/null)
            if jq -e '.status=="ok" and .db=="ok"' /tmp/h > /dev/null 2>&1; then
              vonis "health/$label" HIJAU "${t}s $(tr -d '\n' < /tmp/h)"
            else
              vonis "health/$label" MERAH "isi='$(head -c 120 /tmp/h | tr -d '\n')' time=${t:-koneksi-gagal}"
            fi

            : > /tmp/c
            t=$(curl -fsS --max-time 45 -o /tmp/c -w '%{time_total}' "$base/api/certificates" 2>/dev/null)
            # Program jq ditulis utuh, tidak dirakit dari variabel: '$2' tanpa tanda kutip ganda
            # membuat jq menerima potongan program saja (sisanya jadi argumen terpisah) dan
            # kompilasinya gagal — gejalanya MERAH untuk respons yang sebenarnya sehat.
            n=$(jq 'if type=="array" and length>0 and (.[0] | has("id") and has("title") and has("issuer") and has("date")) then length else null end' /tmp/c 2>/dev/null)
            if [ "$n" != "null" ] && [ -n "$n" ]; then
              vonis "certificates/$label" HIJAU "$n baris, ${t}s"
            else
              vonis "certificates/$label" MERAH "isi='$(head -c 120 /tmp/c | tr -d '\n')' time=${t:-koneksi-gagal}"
            fi
          done

          # experience di domain publik saja; bentuknya kontrak yang sama dengan certificates.
          : > /tmp/e
          curl -fsS --max-time 45 -o /tmp/e "$DOMAIN/api/experience" 2>/dev/null
          n=$(jq 'if type=="array" and length>0 and (.[0] | has("role") and has("company") and has("period")) then length else null end' /tmp/e 2>/dev/null)
          if [ "$n" != "null" ] && [ -n "$n" ]; then
            vonis "experience/domain" HIJAU "$n baris"
          else
            vonis "experience/domain" MERAH "isi='$(head -c 120 /tmp/e | tr -d '\n')'"
          fi

          # halaman utama: landing page utuh, bukan error page Next.js.
          : > /tmp/idx
          t=$(curl -fsS --max-time 60 -H 'Accept: text/html' -o /tmp/idx -w '%{time_total}' "$DOMAIN/" 2>/dev/null)
          bytes=$(wc -c < /tmp/idx)
          if [ -n "$t" ] && [ "$bytes" -ge 5000 ] && ! grep -qi 'Application error' /tmp/idx; then
            vonis "halaman-utama/domain" HIJAU "$bytes byte, ${t}s"
          else
            vonis "halaman-utama/domain" MERAH "$bytes byte, time=${t:-koneksi-gagal}"
          fi

          # /api/cv: magic byte + ukuran minimum. Daftar sertifikat di PDF itu kosong, dan itu hutang
          # M11 yang tercatat di README; kalau assertion ini ikut menuntut isinya, workflow jadi merah
          # permanen — yang mati bukan produksi, tapi nilai informasi jendela observasi.
          : > /tmp/cv
          code=$(curl -sS --max-time 180 -o /tmp/cv -w '%{http_code}' "$DOMAIN/api/cv" 2>/dev/null)
          cb=$(wc -c < /tmp/cv)
          if [ "$code" = "200" ] && [ "$(head -c 5 /tmp/cv)" = "%PDF-" ] && [ "$cb" -ge 50000 ]; then
            vonis "cv-pdf/domain" HIJAU "$cb byte PDF"
          else
            vonis "cv-pdf/domain" MERAH "http=${code:-?}, $cb byte, awal='$(head -c 20 /tmp/cv | tr -d '\n')'"
          fi

          # rewrite fe -> be lewat domain publik: jalur yang sama dengan yang dipakai visitor.
          if curl -fsS --max-time 45 "$DOMAIN/api/health" 2>/dev/null | jq -e '.db=="ok"' > /dev/null 2>&1; then
            vonis "rewrite/domain" HIJAU "/api/health terproxy ke backend"
          else
            vonis "rewrite/domain" MERAH "rewrite fe->be tidak hidup"
          fi

      - name: Drift — main sudah punya deploy hijau?
        run: |
          [ -s /tmp/hasil.tsv ] || echo "komponen|status|detail" > /tmp/hasil.tsv
          # Langkah ini punya banyak titik gagal yang bukan salah produksi (gh tidak ada, token
          # ditolak, fetch gagal). Tanpa guard, kegagalan itu abort di tengah dan baris harian
          # kehilangan komponennya tanpa alasan. Jadi setiap titik gagal menulis vonisnya sendiri.
          set +e
          vonis() { echo "$1|$2|$3" >> /tmp/hasil.tsv; }

          git fetch -q origin main || { vonis drift MERAH "git fetch origin main gagal"; exit 0; }
          expected=$(git log -1 --format=%H --first-parent origin/main -- . ':(exclude)*.md' ':(exclude)docs/**')
          # --first-parent penting di sini. Tanpa itu, merge yang tree-nya sama dengan orangtuanya
          # disimplifikasi keluar dan filter menunjuk commit di dalamnya (14859ce), padahal yang
          # memicu push event adalah merge commit-nya (39eae21). Itu false-positive drift.
          if [ -z "$expected" ]; then
            vonis drift MERAH "tidak ada commit non-dokumen di main — filter path salah?"
            exit 0
          fi
          echo "expected (commit kode terakhir di main): ${expected:0:7}"

          if ! command -v gh > /dev/null; then
            vonis drift MERAH "gh tidak ada di runner"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            vonis drift MERAH "GH_TOKEN kosong: gh menolak jalan di runner"
            exit 0
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?event=push&per_page=20" \
            --jq '.workflow_runs[] | select(.event=="push") | [.head_sha, .status, .conclusion // "-", .run_number] | @tsv' 2>/tmp/gh.err)
          rc=$?
          if [ "$rc" -ne 0 ]; then
            vonis drift MERAH "gh api gagal (rc=$rc): $(head -c 160 /tmp/gh.err | tr -d '\n')"
            exit 0
          fi
          if [ -z "$runs" ]; then
            vonis drift MERAH "tidak ada satu pun run deploy.yml dengan event=push — pemicunya hilang?"
            exit 0
          fi

          latest=$(echo "$runs" | awk -F'\t' '$2=="completed"' | head -1)
          latest_sha=$(echo "$latest" | cut -f1)
          latest_conc=$(echo "$latest" | cut -f3)
          latest_no=$(echo "$latest" | cut -f4)
          ada_yang_jalan=$(echo "$runs" | awk -F'\t' '$2!="completed"' | wc -l)

          echo "deploy push terakhir  : run #${latest_no:-?} @ ${latest_sha:0:7} = $latest_conc"
          echo "run belum selesai     : $ada_yang_jalan"

          if [ "$latest_conc" != "success" ]; then
            vonis drift MERAH "deploy push terakhir (run #${latest_no:-?}) kesimpulannya ${latest_conc:-kosong}"
          elif [ "$latest_sha" != "$expected" ]; then
            if [ "$ada_yang_jalan" -gt 0 ]; then
              vonis drift KUNING "deploy untuk ${expected:0:7} masih berjalan"
            else
              vonis drift MERAH "produksi di ${latest_sha:0:7}, main minta ${expected:0:7}"
            fi
          else
            vonis drift HIJAU "run #${latest_no} hijau untuk ${expected:0:7}, tidak ada deploy lain di atasnya"
          fi
          exit 0

      - name: Drift cloud — siapa yang melayani traffic, dan di SA apa
        run: |
          [ -s /tmp/hasil.tsv ] || echo "komponen|status|detail" > /tmp/hasil.tsv
          set +e
          vonis() { echo "$1|$2|$3" >> /tmp/hasil.tsv; }
          # Detail tidak boleh mengandung '|': kolom status dibaca `awk -F'|'` di langkah gerbang.
          bersih() { printf '%s' "$1" | tr -d '\n' | tr '|' '/'; }

          if ! command -v gcloud > /dev/null; then
            vonis cloud-drift KUNING "gcloud tidak ada di runner — status.traffic tidak terbaca"
            exit 0
          fi

          describe() {
            gcloud run services describe "$1" --project "$PROJECT_ID" \
              --platform managed --region "$REGION" \
              --format='json(status.traffic,status.latestReadyRevisionName,status.latestCreatedRevisionName,spec.template.spec.serviceAccountName)' \
              2>/tmp/cloud.err
          }

          # Menilai "satu target 100%, dan target itu revisi Ready terbaru". Mengisi variabel
          # global untuk dipakai pesan vonis; mengembalikan 0 kalau sesuai.
          cek() {
            READY=$(printf '%s' "$1" | jq -r '.status.latestReadyRevisionName // empty')
            CREATED=$(printf '%s' "$1" | jq -r '.status.latestCreatedRevisionName // empty')
            ALLOC=$(printf '%s' "$1" | jq -r '[.status.traffic[]? | "\(.revisionName // .latestRevisionName)=\(.percent // 0)"] | join(" ")')
            N=$(printf '%s\n' "$ALLOC" | tr ' ' '\n' | grep -c .)
            SUM=$(printf '%s\n' "$ALLOC" | tr ' ' '\n' | awk -F= '{s+=$2} END{print s+0}')
            SERVING=$(printf '%s\n' "$ALLOC" | tr ' ' '\n' | awk -F= '$2==100{print $1; exit}')
            [ -n "$READY" ] && [ "$N" = "1" ] && [ "$SUM" = "100" ] && [ "$SERVING" = "$READY" ]
          }

          for svc in "$BE_SERVICE" "$FE_SERVICE"; do
            js=$(describe "$svc")
            rc=$?
            if [ "$rc" -ne 0 ] || [ -z "$js" ]; then
              vonis "cloud-drift/$svc" KUNING "gcloud describe gagal (rc=$rc): $(bersih "$(head -c 200 /tmp/cloud.err)")"
              continue
            fi
            if ! printf '%s' "$js" | jq -e '.status' > /dev/null 2>&1; then
              vonis "cloud-drift/$svc" KUNING "JSON tidak terbaca: $(bersih "$(printf '%s' "$js" | head -c 160)")"
              continue
            fi
            echo "$svc: sa=$(printf '%s' "$js" | jq -r '.spec.template.spec.serviceAccountName // empty') traffic=$(printf '%s' "$js" | jq -r '[.status.traffic[]? | "\(.revisionName // .latestRevisionName)=\(.percent // 0)"] | join(" ")')"

            # 1. Invarian F5: yang memproses request harus SA runtime least-privilege. Field ini
            #    diam-diam kembali ke default compute SA kalau ada yang deploy manual tanpa
            #    --service-account, dan default itu memegang roles/editor se-proyek.
            sa=$(printf '%s' "$js" | jq -r '.spec.template.spec.serviceAccountName // empty')
            if [ "$sa" = "$RUNTIME_SA" ]; then
              vonis "cloud-sa/$svc" HIJAU "$sa"
            else
              vonis "cloud-sa/$svc" MERAH "berjalan di ${sa:-kosong (= default compute SA)}, diharapkan $RUNTIME_SA"
            fi

            # 2. Traffic. Baca ulang sekali sebelum menuduh: deploy yang sedang berjalan punya
            #    jendela sempit di mana revisi baru sudah dibuat tapi traffic belum dipindah.
            if cek "$js"; then
              vonis "cloud-traffic/$svc" HIJAU "100% di $READY"
            else
              sleep 20
              js2=$(describe "$svc")
              if [ -n "$js2" ] && cek "$js2"; then
                vonis "cloud-traffic/$svc" KUNING "berubah di tengah baca; sekarang 100% di $READY"
              else
                vonis "cloud-traffic/$svc" MERAH "alokasi='$ALLOC' ready=$READY created=$CREATED — bukan satu target 100% di revisi Ready terbaru"
              fi
            fi

            # 3. Revisi terbaru yang belum Ready = deploy menggantung, traffic di revisi lama.
            if [ -n "$CREATED" ] && [ "$CREATED" != "$READY" ]; then
              vonis "cloud-revisi/$svc" KUNING "$CREATED belum Ready (ready=${READY:-kosong})"
            fi
          done
          exit 0

      - name: Tripwire kontrak API
        run: |
          [ -s /tmp/hasil.tsv ] || echo "komponen|status|detail" > /tmp/hasil.tsv
          if node tools/ci/api-contract-check.mjs > /tmp/tripwire.log 2>&1; then
            tail -1 /tmp/tripwire.log
            echo "tripwire|HIJAU|$(tail -1 /tmp/tripwire.log)" >> /tmp/hasil.tsv
          else
            tail -20 /tmp/tripwire.log
            echo "tripwire|MERAH|kontrak tidak sesuai baseline — lihat log langkah ini" >> /tmp/hasil.tsv
          fi

      - name: Branch layu
        run: |
          [ -s /tmp/hasil.tsv ] || echo "komponen|status|detail" > /tmp/hasil.tsv
          set +e # informasi saja: langkah ini tidak boleh membuat run merah
          # `gh` yang gagal jangan sampai dilaporkan sebagai "0 branch layu". Run pertama di
          # runner mencetak pesan GH_TOKEN di stderr dan daftar ref kosong, dan barisnya tetap
          # INFO — persis false-clean yang milestone ini dibangun untuk hilangkan.
          now=$(date -u +%s)
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/refs/heads" --paginate \
            --jq '.[] | "\(.ref|sub("^refs/heads/";"")) \(.object.sha)"' 2>/tmp/refs.err)
          rc=$?
          if [ "$rc" -ne 0 ] || [ -z "$refs" ]; then
            echo "branch-layu|KUNING|daftar ref cabang tidak terbaca (rc=$rc): $(head -c 140 /tmp/refs.err | tr -d '\n')" >> /tmp/hasil.tsv
            exit 0
          fi
          temu=0
          while read -r name sha; do
            [ "$name" = "main" ] && continue
            date_str=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq '.committer.date')
            d=$(date -u -d "$date_str" +%s 2>/dev/null)
            [ -z "$d" ] && { echo "  $name: tanggal tip tidak terbaca ($date_str)"; continue; }
            jam=$(( (now - d) / 3600 ))
            if [ "$jam" -gt "$BRANCH_LAYU_JAM" ]; then
              echo "  $name (${jam} jam)"
              temu=$((temu + 1))
            fi
          done <<< "$refs"
          total=$(echo "$refs" | wc -l)
          echo "branch lebih tua dari ${BRANCH_LAYU_JAM} jam: $temu dari $total cabang (tidak ada yang dihapus)"
          echo "branch-layu|INFO|$temu branch layu dari $total cabang" >> /tmp/hasil.tsv
          exit 0

      - name: Rangkuman satu baris
        if: always()
        run: |
          # if: always() — baris hariannya wajib tetap tertulis walaupun ada langkah yang mati
          # karena sebab di luar probe (gh api gagal, runner bermasalah).
          if [ ! -s /tmp/hasil.tsv ]; then
            printf '%s\n' "komponen|status|detail" \
              "rangkuman|MERAH|/tmp/hasil.tsv kosong: langkah probe tidak menulis vonis apa pun" \
              > /tmp/hasil.tsv
          fi
          merah=$(awk -F'|' '$2=="MERAH"' /tmp/hasil.tsv | wc -l)
          rows=$(tail -n +2 /tmp/hasil.tsv | grep -c .)
          # Cetak juga ke stdout, bukan hanya ke Step Summary. Run #1 di runner membuktikan
          # alasannya: vonisnya cuma ada di ringkasan run, dan ringkasan tidak bisa dibaca dari
          # API log — jadi angka "12 baris lainnya hijau" harus disimpulkan, bukan diukur.
          echo "baris harian: rows=$rows merah=$merah"
          cat /tmp/hasil.tsv
          {
            echo "## Watch — $(date -u +'%Y-%m-%d %H:%M UTC') — rows: $rows, merah: $merah"
            echo
            echo '```text'
            cat /tmp/hasil.tsv
            echo '```'
            echo
            echo '<details><summary>baris machine-readable</summary>'
            echo
            echo '```json'
            tail -n +2 /tmp/hasil.tsv | jq -Rsc '
              split("\n") | map(select(length>0) | split("|") | {c: .[0], s: .[1], d: (.[2:] | join("|"))})
              | {at: "'$(date -u +%FT%TZ)'", merah: (map(select(.s=="MERAH") | .c)), rows: length}'
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Gerbang (run merah kalau ada probe MERAH)
        if: always()
        run: |
          if awk -F'|' '$2=="MERAH"{found=1} END{exit !found}' /tmp/hasil.tsv; then
            echo "Ada probe MERAH hari ini:"
            awk -F'|' '$2=="MERAH"{print "  - " $1 ": " $3}' /tmp/hasil.tsv
            exit 1
          fi
          echo "Semua probe hijau."