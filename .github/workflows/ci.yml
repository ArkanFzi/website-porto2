name: CI

# Gerbang test untuk branch bugfix/* (Bug Hunter & Fixer). Test-SAJA:
# tidak build image, tidak deploy. Jalur deploy tetap hanya deploy.yml
# (push ke main). Menambah bugfix/** ke deploy.yml = melarang diri sendiri.

on:
  push:
    branches: ['bugfix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.3

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b6 # v5.4.0
        with:
          go-version-file: go-backend/go.mod

      - name: Go vet
        working-directory: go-backend
        run: go vet ./...

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs-frontend/package-lock.json

      - name: Install frontend deps
        working-directory: nextjs-frontend
        run: npm ci

      - name: Lint frontend
        working-directory: nextjs-frontend
        run: npm run lint
