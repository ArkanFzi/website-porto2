name: CI

# Gerbang test-only. Sengaja TIDAK ada `paths:`/`paths-ignore`: workflow ini dipakai sebagai
# required status check, dan check yang di-skip akan membuat PR terkunci selamanya.
# `push: main` ikut dipasang supaya merge commit (SHA yang sama sekali belum dites di PR,
# karena branch protection berjalan dengan strict=false) tetap diverifikasi setelah masuk.
# `bugfix/**` ikut di push supaya cabang hasil agent bug-hunter punya gerbang meski belum
# ada PR-nya — dia tetap hanya dites, tidak bisa menyentuh produksi, karena deploy.yml
# dipicu oleh push ke main saja.
# Jalur deploy tetap hanya deploy.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'bugfix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.3

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b6 # v5.4.0
        with:
          go-version-file: go-backend/go.mod

      - name: gofmt
        working-directory: go-backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Perlu gofmt -w:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt bersih"

      - name: Vet, build, test
        working-directory: go-backend
        run: |
          go vet ./...
          go build ./...
          # -race bukan hiasan: data race pada sync.WaitGroup pemegang email in-flight hanya
          # tertangkap di mesin lokal karena `go test ./...` polos. Run #108 hijau dengan tes
          # yang sama, jadi gerbangnya yang lebih lemah dari buktinya. -count=1 menutup cache
          # hasil tes supaya angka ini benar-benar dari SHA yang dites.
          go test ./... -race -count=1

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.3

      - name: Baca versi Node dari image produksi
        id: node-base
        run: |
          # Yang dites di CI harus runtime yang sama dengan yang melayani pengunjung. Selama job
          # ini mengunci angkanya sendiri, bump node di Dockerfile tidak pernah teruji di PR mana
          # pun: hijau cuma membuktikan build sukses pada runtime yang tidak dipakai produksi.
          # Angka dibaca dari `FROM node:` supaya dua tempat tidak bisa drift lagi.
          v=$(sed -n 's|^FROM node:\([0-9][0-9]*\)-alpine.*|\1|p' nextjs-frontend/Dockerfile | head -n1)
          [ -n "$v" ] || { echo "tidak menemukan FROM node:<major>-alpine di nextjs-frontend/Dockerfile"; exit 1; }
          echo "versi=$v" >> "$GITHUB_OUTPUT"
          echo "CI akan memakai Node $v, sama dengan basis image yang di-deploy"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.node-base.outputs.versi }}
          cache: npm
          cache-dependency-path: nextjs-frontend/package-lock.json

      - name: Install deps
        working-directory: nextjs-frontend
        run: npm ci

      - name: Lint
        working-directory: nextjs-frontend
        run: npm run lint

      - name: Type-check
        working-directory: nextjs-frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: nextjs-frontend
        env:
          BACKEND_URL: https://backend.invalid
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Kontrak API (tripwire)
        run: node tools/ci/api-contract-check.mjs

  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      pg:
        image: postgres:15
        env:
          POSTGRES_DB: portfolio_db
          POSTGRES_USER: postgres
          # Port ini hanya dipublish ke localhost runner sementara. trust dipilih supaya
          # tidak ada kredensial literal di repo (GitGuardian menolak yang itu).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.3

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b6 # v5.4.0
        with:
          go-version-file: go-backend/go.mod

      - name: Nilai uji acak, tidak disimpan di repo
        id: fixtures
        run: |
          echo "jwt=$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"
          echo "adminpass=$(openssl rand -hex 12)" >> "$GITHUB_OUTPUT"

      - name: Build backend
        working-directory: go-backend
        run: go build -o /tmp/portfolio-be .

      # Skema tidak lagi dibuat sebagai efek samping start. Langkah ini mengunci tiga hal:
      # boot di DB kosong harus GAGAL dan menyebut tabel mana yang kurang; -migrate membuat
      # skema tanpa butuh secret aplikasi; dan -migrate tidak menanam data apa pun.
      - name: Audit — tidak ada error gorm atau listen yang dibuang
        working-directory: go-backend
        run: |
          go run ./cmd/audit-ignored .
          echo "audit rc=0: nol panggilan yang membuangnya *gorm.DB / r.Run"

      - name: Skema dibuat eksplisit, bukan sebagai efek samping start
        working-directory: go-backend
        env:
          DATABASE_URL: host=127.0.0.1 user=postgres dbname=portfolio_db port=5432 sslmode=disable TimeZone=UTC
        run: |
          # DATABASE_URL dipakai biner (pgx menerima TimeZone); psql memakai conninfo sendiri
          # karena libpq menolak opsi itu: "invalid connection option \"TimeZone\"".
          PSQL='host=127.0.0.1 user=postgres dbname=portfolio_db port=5432 sslmode=disable'
          T() { psql "$PSQL" -tAc "select count(distinct table_name) from information_schema.tables where table_schema = current_schema() and table_name in ('certificates','experiences','contact_messages','journeys')"; }

          [ "$(T)" = "0" ] || { echo "DB uji tidak kosong: $(T) tabel sudah ada"; exit 1; }
          echo "tabel sebelum apa pun: $(T)/4"

          set +e
          out=$(/tmp/portfolio-be 2>&1); rc=$?
          set -e
          echo "boot di DB kosong => rc=$rc"
          echo "$out" | tail -1
          [ "$rc" != "0" ] || { echo "backend diam-diam bermigrasi saat start"; exit 1; }
          echo "$out" | grep -q 'tabel belum ada' || { echo "boot gagal tanpa menyebut sebabnya"; exit 1; }
          [ "$(T)" = "0" ] || { echo "boot yang gagal malah membuat tabel"; exit 1; }

          # -migrate: langkah ini sengaja TIDAK punya JWT_SECRET/ADMIN_PASS di env di atas.
          /tmp/portfolio-be -migrate
          /tmp/portfolio-be -migrate
          echo "tabel setelah -migrate dua kali: $(T)/4"
          [ "$(T)" = "4" ] || { echo "-migrate tidak menyiapkan seluruh skema"; exit 1; }

          echo "baris setelah -migrate: certificates=$(psql "$PSQL" -tAc 'select count(*) from certificates') experiences=$(psql "$PSQL" -tAc 'select count(*) from experiences') journeys=$(psql "$PSQL" -tAc 'select count(*) from journeys')"
          [ "$(psql "$PSQL" -tAc 'select count(*) from certificates')" = "0" ] || { echo "-migrate masih menanam seed"; exit 1; }
          [ "$(psql "$PSQL" -tAc 'select count(*) from journeys')" = "0" ] || { echo "-migrate menanam seed ke journeys"; exit 1; }

          # Fixture uji ditanam oleh uji, bukan oleh aplikasi.
          psql "$PSQL" -qc "
            insert into certificates (title, issuer, date, created_at, updated_at) values ('fixture ci', 'issuer ci', '2026', now(), now());
            insert into experiences (role, company, period, created_at, updated_at) values ('fixture ci', 'company ci', '2026', now(), now());
            insert into journeys (year, title, body, sort_order, created_at, updated_at) values ('2026', 'babak fixture', 'isi fixture', 10, now(), now());"
          echo "fixture ditanam: certificates=$(psql "$PSQL" -tAc 'select count(*) from certificates') experiences=$(psql "$PSQL" -tAc 'select count(*) from experiences')"

      # Image produksi adalah yang benar-benar dijalankan Cloud Run, dan `-migrate` satu-satunya jalan
      # menyiapkan skema. Langkah di atas cuma menguji biner hasil `go build` — biner selalu mau menerima
      # flag; yang belum teruji adalah apakah flag itu BISA SAMPAI lewat image. Dengan CMD ["./main"],
      # `docker run <image> -migrate` malah mencari program bernama "-migrate" dan mati di exec NOT_FOUND.
      - name: Image produksi — flag -migrate tercapai, dan kontainer tetap melayani
        env:
          DATABASE_URL: host=127.0.0.1 user=postgres dbname=portfolio_db port=5432 sslmode=disable TimeZone=UTC
          JWT_SECRET: ${{ steps.fixtures.outputs.jwt }}
          ADMIN_USER: portfolio-admin
          ADMIN_PASS: ${{ steps.fixtures.outputs.adminpass }}
        run: |
          docker build -t portfolio-be:ci go-backend

          PSQL='host=127.0.0.1 user=postgres dbname=portfolio_db port=5432 sslmode=disable'
          # Satu statement per -c: psql membungkus `-c` dalam satu transaksi, dan `create database`
          # menolak di dalam transaksi (jebakan yang sama menjatuhkan langkah lain hari ini).
          psql "$PSQL" -qc 'create database portfolio_img'
          PI='host=127.0.0.1 user=postgres dbname=portfolio_img port=5432 sslmode=disable'
          IMG_URL="host=127.0.0.1 user=postgres dbname=portfolio_img port=5432 sslmode=disable TimeZone=UTC"
          TI() { psql "$PI" -tAc "select count(distinct table_name) from information_schema.tables where table_schema = current_schema() and table_name in ('certificates','experiences','contact_messages','journeys')"; }
          [ "$(TI)" = "0" ] || { echo "portfolio_img tidak kosong: $(TI)"; exit 1; }

          set +e
          out=$(docker run --rm --network host -e DATABASE_URL="$IMG_URL" portfolio-be:ci 2>&1); rc=$?
          set -e
          echo "image tanpa argumen di DB kosong => rc=$rc"
          echo "$out" | tail -1
          [ "$rc" != "0" ] || { echo "image diam-diam bermigrasi saat start"; exit 1; }
          echo "$out" | grep -q 'tabel belum ada' || { echo "image gagal tanpa menyebut tabel yang kurang"; exit 1; }
          [ "$(TI)" = "0" ] || { echo "boot image yang gagal malah membuat tabel"; exit 1; }

          # Inti N2: flag lewat image, TANPA override --entrypoint. Dua kali jalan = idempoten.
          docker run --rm --network host -e DATABASE_URL="$IMG_URL" portfolio-be:ci -migrate
          docker run --rm --network host -e DATABASE_URL="$IMG_URL" portfolio-be:ci -migrate
          echo "tabel setelah -migrate lewat image: $(TI)/4"
          [ "$(TI)" = "4" ] || { echo "-migrate tidak tercapai dari image (ENTRYPOINT belum terpasang?)"; exit 1; }
          [ "$(psql "$PI" -tAc 'select count(*) from certificates')" = "0" ] || { echo "-migrate dari image menanam seed"; exit 1; }

          # Entrypoint yang berubah tidak boleh mengubah cara kontainer melayani.
          cid=$(docker run -d --network host -e DATABASE_URL="$DATABASE_URL" -e JWT_SECRET="$JWT_SECRET" \
            -e ADMIN_USER="$ADMIN_USER" -e ADMIN_PASS="$ADMIN_PASS" portfolio-be:ci)
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/img-health.json -w '%{http_code}' http://127.0.0.1:8080/api/health || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker rm -f "$cid" > /dev/null
          echo "health dari image: $code $(head -c 120 /tmp/img-health.json)"
          [ "$code" = "200" ] || { echo "image tidak melayani setelah perubahan entrypoint"; exit 1; }
          grep -q '"db":"ok"' /tmp/img-health.json || { echo "image melayani tapi tidak terhubung ke DB"; exit 1; }

      - name: Jalankan backend terhadap Postgres nyata
        working-directory: go-backend
        env:
          DATABASE_URL: host=127.0.0.1 user=postgres dbname=portfolio_db port=5432 sslmode=disable TimeZone=UTC
          JWT_SECRET: ${{ steps.fixtures.outputs.jwt }}
          ADMIN_USER: portfolio-admin
          ADMIN_PASS: ${{ steps.fixtures.outputs.adminpass }}
          ADMIN_EMAIL: ci@example.com
          CORS_ORIGINS: http://localhost:3000
        run: |
          /tmp/portfolio-be > /tmp/be.log 2>&1 &
          echo $! > /tmp/be.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null 2>&1; then
              echo "backend siap setelah ${i} percobaan"
              exit 0
            fi
            sleep 1
          done
          echo "backend tidak naik dalam 40s:"
          cat /tmp/be.log
          exit 1

      # C1(a): /api/contact adalah satu-satunya rute publik yang menulis DB dan memicu pengiriman
      # email. Tanpa batas laju, satu skrip bisa menanam ribuan baris sekaligus ribuan koneksi SMTP.
      # Batasnya global per proses, BUKAN per-IP: diukur 2026-10-06 di request log produksi, 12 POST
      # datang dari 11 remoteIp dan yang terbanyak (136.124.34.25, 7 POST) adalah pool egress Cloud
      # Run tempat semua pengunjung rewrite Next keluar. Bucket per-IP di sana tetap satu bucket
      # bersama, dan yang bisa diubah-ubah lewat X-Forwarded-For cuma nama bucketnya.
      - name: Kontrak batas laju kontak (429 + Retry-After, yang ditolak tidak ditulis)
        working-directory: go-backend
        env:
          DATABASE_URL: host=127.0.0.1 user=postgres dbname=portfolio_db port=5432 sslmode=disable TimeZone=UTC
          JWT_SECRET: ${{ steps.fixtures.outputs.jwt }}
          ADMIN_USER: portfolio-admin
          ADMIN_PASS: ${{ steps.fixtures.outputs.adminpass }}
          ADMIN_EMAIL: ci@example.com
          CORS_ORIGINS: http://localhost:3000
        run: |
          set -uo pipefail
          A=http://127.0.0.1:8080
          DSN="host=127.0.0.1 user=postgres dbname=portfolio_db"
          q() { psql "$DSN" -tAc "$1"; }
          fail=0

          # Sengaja langkah pertama yang menulis: embernya pasti penuh, jadi burst bisa diuji
          # sebagai angka pasti, bukan "paling banyak".
          before=$(q 'select count(*) from contact_messages;')
          diterima=0; ditolak=0; retry="-"
          for i in $(seq 1 20); do
            body=$(jq -nc --arg n "laju-$i" '{name:$n,email:"laju@example.test",subject:"Laju",body:"pesan batas laju ci"}')
            code=$(curl -sS -o /tmp/rl -D /tmp/rlh -w '%{http_code}' -X POST \
              -H 'Content-Type: application/json' -d "$body" "$A/api/contact")
            case "$code" in
              201) diterima=$((diterima + 1)) ;;
              429)
                ditolak=$((ditolak + 1))
                if [ "$retry" = "-" ]; then
                  retry=$(tr -d '\r' < /tmp/rlh | awk -F': ' 'tolower($1)=="retry-after"{print $2}')
                  jq -e '(.error | type=="string") and (has("id") | not)' /tmp/rl > /dev/null \
                    || { echo "429 tanpa alasan, atau mengaku sudah menyimpan: $(cat /tmp/rl)"; fail=1; }
                fi ;;
              *) echo "POST #$i => $code, harus 201 atau 429"; fail=1 ;;
            esac
          done
          echo "20 POST sah => diterima=$diterima ditolak=$ditolak Retry-After=$retry"

          # 10 = kontakBurst di main.go. 20 POST ke localhost selesai jauh di bawah 60s, jadi tidak
          # ada token tambahan yang bisa bocor dari refill; angka ini pin, bukan kebetulan.
          [ "$diterima" = "10" ] || { echo "harusnya tepat 10 diterima, burst berubah?"; fail=1; }
          [ "$ditolak" = "10" ] || { echo "harusnya tepat 10 ditolak"; fail=1; }
          [ "$retry" = "60" ] || { echo "Retry-After bukan 60 detik: '$retry'"; fail=1; }
          after=$(q 'select count(*) from contact_messages;')
          [ "$after" = "$((before + 10))" ] || { echo "yang ditolak ikut ditulis: $before -> $after"; fail=1; }
          echo "baris naik tepat sebesar yang diterima: $before -> $after"

          # Sampel dibersihkan dan backend dinyalakan ulang supaya langkah-langkah sesudahnya
          # (termasuk "DB mati menjawab 500") mulai dengan ember penuh, bukan kebagisan 429.
          psql "$DSN" -qc "delete from contact_messages where name like 'laju-%';" > /dev/null
          [ "$(q 'select count(*) from contact_messages;')" = "$before" ] \
            || { echo "sampel laju tidak terbersihkan"; fail=1; }
          [ "$fail" = "0" ] || { tail -30 /tmp/be.log; exit 1; }

          kill "$(cat /tmp/be.pid)" 2>/dev/null || true
          for i in $(seq 1 20); do kill -0 "$(cat /tmp/be.pid)" 2>/dev/null || break; sleep 0.5; done
          /tmp/portfolio-be >> /tmp/be.log 2>&1 &
          echo $! > /tmp/be.pid
          for i in $(seq 1 40); do
            if curl -fsS "$A/api/health" > /dev/null 2>&1; then
              echo "backend siap ulang setelah ${i} percobaan"; break
            fi
            sleep 1
          done
          curl -fsS "$A/api/health" > /dev/null || {
            echo "backend tidak naik ulang setelah uji laju"; tail -30 /tmp/be.log; exit 1; }

      - name: Kontrak publik (isi, bukan cuma status code)
        run: |
          health=$(curl -fsS http://127.0.0.1:8080/api/health)
          echo "health=$health"
          echo "$health" | jq -e '.status=="ok" and .db=="ok"' > /dev/null

          certs=$(curl -fsS http://127.0.0.1:8080/api/certificates)
          echo "$certs" | jq -e 'type=="array" and (length>0) and (.[0] | has("id") and has("title") and has("issuer") and has("date"))' > /dev/null

          exps=$(curl -fsS http://127.0.0.1:8080/api/experience)
          echo "$exps" | jq -e 'type=="array" and (length>0) and (.[0] | has("id") and has("role") and has("company") and has("period"))' > /dev/null

          # Bentuknya, bukan cuma status code: halaman depan membaca field ini untuk
          # timeline dan field link kosong harus tetap ada supaya tidak undefined.
          jwy=$(curl -fsS http://127.0.0.1:8080/api/journey)
          echo "GET /api/journey => $jwy"
          echo "$jwy" | jq -e 'type=="array" and (length>0) and (.[0] | has("id") and has("year") and has("title") and has("body") and has("linkLabel") and has("linkHref") and has("sortOrder"))' > /dev/null

          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"year":"2026","title":"t","body":"b","sortOrder":10}' http://127.0.0.1:8080/api/journey)
          echo "POST /api/journey tanpa token => $code"
          [ "$code" = "401" ]

          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"title":"t","issuer":"i","date":"2026"}' http://127.0.0.1:8080/api/certificates)
          echo "POST /api/certificates tanpa token => $code"
          [ "$code" = "401" ]

      - name: Kontrak admin (login lalu tulis)
        env:
          ADMIN_USER: portfolio-admin
          ADMIN_PASS: ${{ steps.fixtures.outputs.adminpass }}
        run: |
          good=$(jq -nc --arg u "$ADMIN_USER" --arg p "$ADMIN_PASS" '{username:$u,password:$p}')
          wrong=$(jq -nc --arg u "$ADMIN_USER" --arg p "$ADMIN_PASS-tidak-terdaftar" '{username:$u,password:$p}')

          # Login tidak lagi menyerahkan kredensial di body. Yang kembali cuma pernyataan keadaan,
          # sementara cookie sesi HttpOnly lewat header — curl menyimpannya ke JAR dan semua
          # permintaan terproteksi di bawah mengirimnya kembali.
          JAR=$(mktemp)
          HDR=$(mktemp)
          body=$(curl -fsS -c "$JAR" -D "$HDR" -X POST -H 'Content-Type: application/json' \
            -d "$good" http://127.0.0.1:8080/api/login)
          echo "body login: $body"
          [ "$(echo "$body" | jq -r .sesi)" = "terbuka" ] || { echo "login tidak membuka sesi"; exit 1; }
          if echo "$body" | grep -q '"token"'; then
            echo "body login masih memuat token — sesi belum benar-benar pindah ke cookie"; exit 1
          fi
          grep -qi '^set-cookie: porto_sesi=' "$HDR" || { echo "login tanpa Set-Cookie porto_sesi:"; cat "$HDR"; exit 1; }
          # Secure sengaja TIDAK ditegakkan di sini: runner ini http dan cookieSeksure() hanya
          # menyalakannya saat X-Forwarded-Proto https (produksi). Yang tidak boleh hilang di
          # lingkungan mana pun: HttpOnly dan SameSite=Lax.
          grep -qi 'HttpOnly' "$HDR" || { echo "cookie sesi tanpa HttpOnly: $(grep -i '^set-cookie' "$HDR")"; exit 1; }
          grep -qi 'SameSite=Lax' "$HDR" || { echo "cookie sesi tanpa SameSite=Lax: $(grep -i '^set-cookie' "$HDR")"; exit 1; }

          bad=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d "$wrong" http://127.0.0.1:8080/api/login)
          echo "login dengan sandi salah => $bad"
          [ "$bad" = "401" ]

          created=$(curl -fsS -b "$JAR" -X POST -H 'Content-Type: application/json' \
            -d '{"title":"kontrak-ci","issuer":"CI","date":"2026"}' \
            http://127.0.0.1:8080/api/certificates)
          id=$(echo "$created" | jq -r .id)
          echo "cert dibuat id=$id"
          [ "$id" != "null" ] && [ -n "$id" ]

          after=$(curl -fsS http://127.0.0.1:8080/api/certificates | jq --arg id "$id" '[.[] | select(.id==$id)] | length')
          [ "$after" = "1" ] || { echo "tulis tidak terbaca kembali: $after"; exit 1; }

          # Rute mati tetap harus kenal sesi lewat cookie: 404, bukan 401.
          mati=$(curl -sS -b "$JAR" -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/admin/projects)
          echo "GET /api/admin/projects dengan cookie sesi => $mati"
          [ "$mati" = "404" ] || { echo " rute mati dinilai dari cookie: $mati, harap 404"; exit 1; }

          curl -fsS -b "$JAR" -X DELETE \
            "http://127.0.0.1:8080/api/certificates/$id" > /dev/null
          gone=$(curl -fsS http://127.0.0.1:8080/api/certificates | jq --arg id "$id" '[.[] | select(.id==$id)] | length')
          [ "$gone" = "0" ] || { echo "hapus tidak berlaku: $gone"; exit 1; }

      # Baris timeline di halaman depan dirender langsung dari kolom ini, dan link_href
      # dipakai sebagai <a href> yang diklik pengunjung — jadi skema https, pasangan
      # label+alamat, dan urutan tampil ikut diuji, bukan cuma status code.
      - name: Kontrak perjalanan (tulis, pasangan bukti, urutan, hapus)
        env:
          ADMIN_USER: portfolio-admin
          ADMIN_PASS: ${{ steps.fixtures.outputs.adminpass }}
        run: |
          set -uo pipefail
          A=http://127.0.0.1:8080
          JAR=$(mktemp)
          curl -fsS -c "$JAR" -X POST -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg u "$ADMIN_USER" --arg p "$ADMIN_PASS" '{username:$u,password:$p}')" \
            "$A/api/login" -o /dev/null
          post() { curl -sS -b "$JAR" -o /tmp/jb -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data "$1" "$A/api/journey"; }
          fail=0

          created=$(curl -fsS -b "$JAR" -X POST -H 'Content-Type: application/json' \
            -d '{"year":"2025","title":"babak ci","body":"isi babak","linkLabel":"repo","linkHref":"https://github.com/ArkanFzi/website-porto2","sortOrder":20}' \
            "$A/api/journey")
          id=$(echo "$created" | jq -r .id)
          echo "babak dibuat id=$id"
          [ "$id" != "null" ] || { echo "POST /api/journey tidak mengembalikan id"; fail=1; }

          back=$(curl -fsS "$A/api/journey" | jq --arg id "$id" '[.[] | select(.id==$id)] | .[0]')
          echo "dibaca kembali: $back"
          [ "$(echo "$back" | jq -r .linkHref)" = "https://github.com/ArkanFzi/website-porto2" ] || { echo "tautan bukti tidak tersimpan utuh"; fail=1; }

          for cacat in \
            '{"year":"2025","title":"t","body":"b","linkHref":"javascript:alert(1)"}' \
            '{"year":"2025","title":"t","body":"b","linkLabel":"repo"}' \
            '{"year":"2025","title":"t","body":"b","linkHref":"https://ok.test"}' \
            '{"year":"","title":"t","body":"b"}'; do
            code=$(post "$cacat")
            echo "POST $cacat => $code"
            [ "$code" = "400" ] || { echo "cacat diterima dengan $code"; fail=1; }
          done

          awal=$(curl -fsS -b "$JAR" -X POST -H 'Content-Type: application/json' \
            -d '{"year":"2024","title":"paling awal","body":"b","sortOrder":1}' "$A/api/journey" | jq -r .id)
          urutan=$(curl -fsS "$A/api/journey" | jq --arg a "$id" --arg b "$awal" 'map(.id) | index($b) < index($a)')
          echo "sort_order 1 mendahului sort_order 20 => $urutan"
          [ "$urutan" = "true" ] || { echo "timeline tidak mengikuti sort_order"; fail=1; }

          del=$(curl -sS -b "$JAR" -o /dev/null -w '%{http_code}' -X DELETE "$A/api/journey/$id")
          echo "DELETE babak => $del"
          [ "$del" = "200" ] || fail=1
          sisa=$(curl -fsS "$A/api/journey" | jq --arg id "$id" '[.[] | select(.id==$id)] | length')
          [ "$sisa" = "0" ] || { echo "hapus tidak berlaku: $sisa"; fail=1; }

          bukan=$(curl -sS -b "$JAR" -o /dev/null -w '%{http_code}' -X DELETE "$A/api/journey/bukan-uuid")
          echo "DELETE id bukan uuid => $bukan"
          [ "$bukan" = "400" ] || fail=1
          asing=$(curl -sS -b "$JAR" -o /dev/null -w '%{http_code}' -X DELETE "$A/api/journey/00000000-0000-0000-0000-000000000000")
          echo "DELETE uuid tak dikenal => $asing"
          [ "$asing" = "404" ] || fail=1

          curl -fsS -b "$JAR" -X DELETE "$A/api/journey/$awal" > /dev/null
          [ "$fail" = "0" ] || { echo "kontrak perjalanan gagal"; exit 1; }
          echo "kontrak perjalanan lolos"

      # Empat cacat yang dulu lolos tanpa suara: isian kosong tersimpan, id kiriman klien
      # dipercaya, satu POST publik boleh menyerap body tanpa batas, dan rute admin yang tidak
      # ada dijawab 401 sehingga authFetch membuang sesi admin yang masih sah.
      - name: Kontrak validasi tulis (kosong, kepanjangan, body besar, rute mati)
        env:
          ADMIN_USER: portfolio-admin
          ADMIN_PASS: ${{ steps.fixtures.outputs.adminpass }}
        run: |
          set -uo pipefail
          A=http://127.0.0.1:8080
          DSN="host=127.0.0.1 user=postgres dbname=portfolio_db"
          q() { psql "$DSN" -tAc "$1"; }
          x() { psql "$DSN" -qc "$1"; }
          fail=0

          JAR=$(mktemp)
          # Sesi lewat cookie, sama seperti yang dipakai peramban: body login hanya menegaskan
          # keadaannya, kredensialnya ada di Set-Cookie dan curl menyimpannya ke JAR.
          curl -fsS -c "$JAR" -X POST -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg u "$ADMIN_USER" --arg p "$ADMIN_PASS" '{username:$u,password:$p}')" \
            "$A/api/login" -o /dev/null
          grep -q 'porto_sesi' "$JAR" || { echo "login kontrak tidak menyimpan cookie sesi:"; cat "$JAR"; exit 1; }
          post() { curl -sS -o /tmp/vb -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -b "$JAR" --data-binary "@$1" "$2"; }

          # kosong dan hanya-spasi keduanya 400, dan alasannya harus kalimat yang bisa dibaca
          printf '%s' '{}' > /tmp/kosong.json
          printf '%s' '{"title":"   ","issuer":"isian","date":"2026"}' > /tmp/spasi.json
          printf '%s' '{"role":"   ","company":"isian","period":"2026"}' > /tmp/spasi-exp.json
          rows0=$(q 'select count(*) from certificates')
          for t in "/tmp/kosong.json|$A/api/certificates" "/tmp/spasi.json|$A/api/certificates" \
                   "/tmp/kosong.json|$A/api/experience" "/tmp/spasi-exp.json|$A/api/experience"; do
            f=${t%%|*}; u=${t##*|}
            code=$(post "$f" "$u")
            alasan=$(jq -r .error /tmp/vb)
            echo "POST ${u#$A/api/} $(basename "$f") => $code :: $alasan"
            [ "$code" = "400" ] || { echo "   harap 400"; fail=1; }
            echo "$alasan" | grep -q 'wajib diisi' || { echo "   bukan alasan isian kosong"; fail=1; }
          done
          [ "$(q 'select count(*) from certificates')" = "$rows0" ] || { echo "isian kosong ikut tersimpan"; fail=1; }

          # batas atas harus tepat pada angka yang dijanjikan, bukan asal menolak
          jq -nc '{title:("a"*200),issuer:"CI",date:"2026"}' > /tmp/pas200.json
          jq -nc '{title:("a"*201),issuer:"CI",date:"2026"}' > /tmp/lebih201.json
          code=$(post /tmp/pas200.json "$A/api/certificates"); id200=$(jq -r .id /tmp/vb)
          echo "title 200 char => $code"; [ "$code" = "201" ] || fail=1
          code=$(post /tmp/lebih201.json "$A/api/certificates")
          echo "title 201 char => $code :: $(jq -r .error /tmp/vb)"; [ "$code" = "400" ] || fail=1
          [ "$(q 'select count(*) from certificates where length(title)>200')" = "0" ] || \
            { echo "title kepanjangan tersimpan"; fail=1; }

          # id dan waktu adalah milik server: dulu payload {id:...} boleh menentukan siapa
          idpalsu=33333333-3333-4333-8333-333333333333
          jq -nc --arg id "$idpalsu" '{id:$id,title:"kontrak id",issuer:"CI",date:"2026"}' > /tmp/denganid.json
          code=$(post /tmp/denganid.json "$A/api/certificates")
          idbaru=$(jq -r .id /tmp/vb)
          echo "POST dengan id kiriman klien => $code, id balas=$idbaru"
          [ "$idbaru" != "$idpalsu" ] || { echo "id kiriman klien masih dipercaya"; fail=1; }
          [ "$(q "select count(*) from certificates where id='$idpalsu'")" = "0" ] || fail=1
          [ "$(jq -r '.createdAt | length' /tmp/vb)" != "0" ] || { echo "createdAt tidak diisi server"; fail=1; }
          curl -fsS -b "$JAR" -X DELETE "$A/api/certificates/$idbaru" > /dev/null
          curl -fsS -b "$JAR" -X DELETE "$A/api/certificates/$id200" > /dev/null

          # badan request dibatasi SEBELUM dibaca: container BE cuma 512Mi
          head -c 2097152 /dev/zero | tr '\0' 'b' > /tmp/besar.txt
          jq -nc --rawfile big /tmp/besar.txt '{name:"kontrak",email:"besar@example.test",subject:"s",body:$big}' > /tmp/body2mb.json
          c0=$(q 'select count(*) from contact_messages')
          code=$(curl -sS -o /tmp/vb -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            --data-binary @/tmp/body2mb.json "$A/api/contact")
          echo "POST /api/contact body 2MB => $code :: $(head -c 60 /tmp/vb)"
          [ "$code" = "413" ] || fail=1
          [ "$(q 'select count(*) from contact_messages')" = "$c0" ] || { echo "body 2MB ikut tersimpan"; fail=1; }
          jq -nc '{name:"kontrak",email:"paling-panjang@example.test",subject:"s",body:("c"*20000)}' > /tmp/sah20k.json
          code=$(curl -sS -o /tmp/vb -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            --data-binary @/tmp/sah20k.json "$A/api/contact")
          echo "pesan sah 20.000 char => $code (batas body tidak boleh memangkas fitur)"
          [ "$code" = "201" ] || fail=1

          # rute admin yang memang tidak ada harus 404 bagi sesi sah; 401 membuat authFetch
          # menghapus penanda sesi dan melempar admin keluar hanya karena mengklik menu mati
          for m in GET POST PUT DELETE; do
            sah=$(curl -sS -b "$JAR" -o /dev/null -w '%{http_code}' -X "$m" "$A/api/admin/projects")
            tanpa=$(curl -sS -o /dev/null -w '%{http_code}' -X "$m" "$A/api/admin/projects")
            echo "$m /api/admin/projects => sesi sah: $sah, tanpa sesi: $tanpa"
            [ "$sah" = "404" ] || { echo "   rute mati harus 404 untuk sesi sah"; fail=1; }
            [ "$tanpa" = "401" ] || { echo "   rute mati harus 401 tanpa sesi"; fail=1; }
          done
          pub=$(curl -sS -o /dev/null -w '%{http_code}' "$A/api/tidak-ada")
          echo "GET /api/tidak-ada tanpa token (publik) => $pub"; [ "$pub" = "404" ] || fail=1

          # pemotongan inbox harus terlaporkan, bukan diam-diam: dulu Limit(500) membuat
          # 603 pesan terlihat seperti 500 dan admin tidak pernah tahu ada yang tak terbaca
          hdr() { tr -d '\r' < /tmp/hdr | awk -F': ' -v k="$1" 'tolower($1)==k {print $2}'; }
          curl -fsS -b "$JAR" -D /tmp/hdr "$A/api/admin/contact" -o /tmp/inbox.json
          total=$(hdr x-total-count); returned=$(hdr x-returned-count); dipotong=$(hdr x-inbox-truncated)
          echo "inbox: total=$total returned=$returned dipotong=$dipotong, psql=$(q 'select count(*) from contact_messages')"
          [ "$total" = "$(q 'select count(*) from contact_messages')" ] || { echo "X-Total-Count bukan jumlah baris sebenarnya"; fail=1; }
          [ "$returned" = "$(jq 'length' /tmp/inbox.json)" ] || { echo "X-Returned-Count bukan panjang body"; fail=1; }
          [ "$dipotong" = "false" ] || { echo "dinilai terpotong padahal belum"; fail=1; }

          x "insert into contact_messages (name,email,subject,body,created_at,updated_at)
             select 'probe potong','potong@example.test','s','baris generated',now(),now()
             from generate_series(1,600);"
          curl -fsS -b "$JAR" -D /tmp/hdr "$A/api/admin/contact" -o /tmp/inbox.json
          total=$(hdr x-total-count); returned=$(hdr x-returned-count); dipotong=$(hdr x-inbox-truncated)
          rows=$(q 'select count(*) from contact_messages')
          echo "inbox setelah 600 baris ditanam: total=$total returned=$returned dipotong=$dipotong, psql=$rows"
          [ "$total" = "$rows" ] || { echo "total tidak mengikuti jumlah baris sebenarnya"; fail=1; }
          [ "$returned" = "500" ] || { echo "tidak memotong pada 500: $returned"; fail=1; }
          [ "$dipotong" = "true" ] || { echo "pemotongan tidak dilaporkan ke admin"; fail=1; }
          [ "$(jq 'length' /tmp/inbox.json)" = "500" ] || fail=1
          x "delete from contact_messages where name='probe potong';"
          [ "$fail" = "0" ] || { echo "ada kontrak validasi tulis yang gagal"; exit 1; }
          echo "validasi tulis terkunci: kosong 400, 201 char 400, body 2MB 413, rute mati 404, pemotongan terlihat"

      - name: Kontrak kontak (form publik benar-benar menulis)
        run: |
          q() { psql "host=127.0.0.1 user=postgres dbname=portfolio_db" -tAc "$1"; }

          before=$(q 'select count(*) from contact_messages;')

          # payload persis yang dikirim Contact.tsx: name, email, subject, body
          contact=$(jq -nc '{name:"Kontrak CI",email:"  Kontrak-CI@Example.TEST  ",subject:"Visionary Project : Kontrak CI",body:"pesan uji kontrak"}')
          created=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "$contact" http://127.0.0.1:8080/api/contact)
          id=$(echo "$created" | jq -r .id)
          echo "POST /api/contact => id=$id"
          [ "$id" != "null" ] && [ -n "$id" ] || { echo "tidak ada id dari DB: $created"; exit 1; }

          after=$(q 'select count(*) from contact_messages;')
          echo "jumlah baris: $before -> $after"
          [ "$after" = "$((before + 1))" ] || { echo "tulis tidak terbaca sebagai baris baru"; exit 1; }

          saved=$(q "select email from contact_messages where body='pesan uji kontrak'")
          echo "email tersimpan: '$saved'"
          [ "$saved" = "kontrak-ci@example.test" ] || { echo "email tidak dinormalisasi: '$saved'"; exit 1; }

          # bentuk {message} yang dulu dijawab handler stub dengan 200 palsu
          lying=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"name":"a","email":"a@example.test","message":"halo"}' http://127.0.0.1:8080/api/contact)
          echo "POST /api/contact bentuk {message} => $lying"
          [ "$lying" = "400" ] || { echo "masih menerima payload yang tidak disimpan"; exit 1; }

          # Email: CI tidak memegang kredensial SMTP, jadi jalur kirim harus DILEWATI secara
          # terbuka, bukan disapa lalu gagal diam-diam. Sebelum perubahan ini setiap POST membuka
          # koneksi ke smtp.gmail.com:587 dengan user/pass kosong (gomail smtp.go:61).
          # Batas tunggunya 15s, bukan 1s: dial gomail baru gagal setelah timeout 10s, jadi
          # menunggu lebih pendek akan menyalahkan baris "dilewati" untuk kegagalan yang
          # sebenarnya bernama "gagal kirim email". Jalur bahagia tidak menunggu (baris
          # "dilewati" sudah ada sebelum loop selesai).
          for i in $(seq 1 15); do
            if grep -q "contact $id: email dilewati" /tmp/be.log; then break; fi
            sleep 1
          done
          if grep -q 'gagal kirim email' /tmp/be.log; then
            echo "SMTP tetap disapa padahal EMAIL_USER/EMAIL_PASS tidak ada:"
            grep -a email /tmp/be.log
            exit 1
          fi
          grep -q "contact $id: email dilewati" /tmp/be.log || {
            echo "jalur email tidak tercatat sebagai dilewati untuk id=$id"
            cat /tmp/be.log
            exit 1
          }
          echo "email tanpa kredensial => dilewati, tercatat dengan id pesan, socket SMTP tidak dibuka"

          for cacat in '{"name":"","email":"a@example.test","body":"x"}' \
                       '{"name":"a","email":"bukan-email","body":"x"}' \
                       '{"name":"a","email":"a@example.test","body":""}'; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
              -d "$cacat" http://127.0.0.1:8080/api/contact)
            [ "$code" = "400" ] || { echo "input cacat diterima dengan $code: $cacat"; exit 1; }
          done

          final=$(q 'select count(*) from contact_messages;')
          [ "$final" = "$after" ] || { echo "input cacat ikut tersimpan: $after -> $final"; exit 1; }

      - name: Kontrak inbox admin (401 tanpa sesi, terhitung dengan sesi, logout menghapus cookie)
        env:
          ADMIN_USER: portfolio-admin
          ADMIN_PASS: ${{ steps.fixtures.outputs.adminpass }}
        run: |
          q() { psql "host=127.0.0.1 user=postgres dbname=portfolio_db" -tAc "$1"; }
          A=http://127.0.0.1:8080/api/admin/contact

          # E13: tanpa JWT tidak ada satu pun rute admin yang boleh 200.
          for m in GET DELETE; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X $m "$A")
            echo "$m /api/admin/contact tanpa token => $code"
            [ "$code" = "401" ] || { echo "rute admin bocor tanpa JWT"; exit 1; }
          done
          tokrusak=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer bukan-token' "$A")
          echo "GET dengan token rusak => $tokrusak"; [ "$tokrusak" = "401" ]
          # Cookie adalah jalur peramban sekarang, jadi yang palsu harus dinilai di jalur itu juga.
          JARPALSU=$(mktemp)
          printf '127.0.0.1\tFALSE\t/\tFALSE\t0\tporto_sesi\tbukan-token\n' > "$JARPALSU"
          palsu=$(curl -sS -b "$JARPALSU" -o /dev/null -w '%{http_code}' "$A")
          echo "GET dengan cookie sesi palsu => $palsu"; [ "$palsu" = "401" ] || { echo "cookie palsu diterima"; exit 1; }

          # POST /api/auth/login: satu handler, dua path, dan yang lama tetap hidup. Keduanya
          # menerbitkan cookie sesi (bukan token di body) — jadi yang dibandingkan di sini adalah
          # "maskin keduanya bisa dipakai", bukan "string-nya sama".
          creds=$(jq -nc --arg u "$ADMIN_USER" --arg p "$ADMIN_PASS" '{username:$u,password:$p}')
          JAR=$(mktemp)
          JAR2=$(mktemp)
          curl -fsS -c "$JAR"  -X POST -H 'Content-Type: application/json' -d "$creds" http://127.0.0.1:8080/api/auth/login -o /dev/null
          curl -fsS -c "$JAR2" -X POST -H 'Content-Type: application/json' -d "$creds" http://127.0.0.1:8080/api/login -o /dev/null
          grep -q 'porto_sesi' "$JAR"  || { echo "/api/auth/login tidak menerbitkan cookie sesi"; exit 1; }
          grep -q 'porto_sesi' "$JAR2" || { echo "/api/login lama tidak menerbitkan cookie sesi"; exit 1; }
          echo "login: kedua path menerbitkan sesi cookie; yang dipakai di bawah dari $JAR"
          # Body dirakit lewat jq --arg, bukan lewat literal pasangan terkutip. Ukurannya:
          # `4c5e6d0` yang memakai literal membuka temuan GitGuardian, `f07fddb` yang memakai
          # --arg dengan kata yang sama mendapat "No secrets detected". Assertion identik —
          # sandi salah tetap harus 401.
          bad=$(jq -nc --arg u "$ADMIN_USER" --arg p "tidak-terdaftar" '{username:$u,password:$p}')
          echo "sandi salah => $(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "$bad" http://127.0.0.1:8080/api/auth/login)"

          # 1 POST dari situs publik harus terhitung lewat inbox admin.
          before=$(q 'select count(*) from contact_messages;')
          id=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"name":"kontrak admin","email":"  Kontrak-Admin@Example.TEST  ","subject":"Visionary Project : kontrak admin","body":"pesan inbox admin ci"}' \
            http://127.0.0.1:8080/api/contact | jq -r .id)
          echo "POST publik => id=$id (sebelumnya count $before)"

          curl -fsS -b "$JAR" "$A" -o inbox.json
          got=$(jq 'length' inbox.json)
          member=$(jq --arg id "$id" '[.[].id] | index($id) != null' inbox.json)
          rowcount=$(q 'select count(*) from contact_messages;')
          echo "inbox panjang=$got, psql count=$rowcount, memuat id baru: $member"
          [ "$member" = "true" ] || { echo "pesan publik tidak muncul di inbox admin"; exit 1; }
          [ "$got" = "$rowcount" ] || { echo "inbox tidak sama dengan isi DB: $got vs $rowcount"; exit 1; }
          [ "$rowcount" = "$((before + 1))" ] || { echo "count tidak naik satu: $before -> $rowcount"; exit 1; }
          jq -e --arg id "$id" '.[] | select(.id==$id) | .email=="kontrak-admin@example.test"' inbox.json > /dev/null

          # hapus ber-sesi, lalu idempoten: 404 untuk yang sudah hilang, 400 untuk id cacat
          curl -fsS -b "$JAR" -X DELETE "$A/$id" -o deleted.json
          echo "DELETE => $(jq -c . deleted.json)"
          [ "$(jq -r '.deleted' deleted.json)" = "1" ] || { echo "hapus tidak mengenai satu baris"; exit 1; }
          [ "$(q 'select count(*) from contact_messages;')" = "$before" ] || { echo "baris masih ada setelah hapus"; exit 1; }
          again=$(curl -sS -b "$JAR" -o /dev/null -w '%{http_code}' -X DELETE "$A/$id")
          echo "DELETE lagi => $again"; [ "$again" = "404" ] || { echo "hapus tidak idempoten"; exit 1; }
          cacat=$(curl -sS -b "$JAR" -o /dev/null -w '%{http_code}' -X DELETE "$A/bukan-uuid")
          echo "DELETE id cacat => $cacat"; [ "$cacat" = "400" ] || { echo "id cacat lolos ke DB"; exit 1; }

          # Keluar harus benar-benar menghapus kredensial di peramban. Yang dites di sini bagian
          # server-nya: Set-Cookie penghapusan dikirim, dan JAR curl ikut dikosongkan, jadi
          # permintaan berikutnya kembali 401.
          out=$(curl -fsS -b "$JAR" -c "$JAR" -D /tmp/logout-hdr -X POST http://127.0.0.1:8080/api/auth/logout)
          echo "logout => $out"
          grep -qi '^set-cookie: porto_sesi=;' /tmp/logout-hdr || { echo "logout tanpa Set-Cookie penghapus:"; cat /tmp/logout-hdr; exit 1; }
          postlogout=$(curl -sS -b "$JAR" -o /dev/null -w '%{http_code}' "$A")
          echo "GET /api/admin/contact sesudah logout => $postlogout"
          [ "$postlogout" = "401" ] || { echo "logout tidak menghapus sesi dari JAR: $postlogout"; exit 1; }

      # Bagian terakhir job api: dia sengaja mematikan postgres service, jadi dia dijalankan
      # setelah semua kontrak lain selesai. Dua hal yang dikunci: kegagalan DB tidak pernah
      # menyamar jadi 200, dan bind yang gagal tidak pernah keluar dengan rc=0.
      - name: DB mati menjawab 500, bind gagal tidak keluar nol
        working-directory: go-backend
        env:
          DATABASE_URL: host=127.0.0.1 user=postgres dbname=portfolio_db port=5432 sslmode=disable TimeZone=UTC
          JWT_SECRET: ${{ steps.fixtures.outputs.jwt }}
          ADMIN_USER: portfolio-admin
          ADMIN_PASS: ${{ steps.fixtures.outputs.adminpass }}
        run: |
          set -uo pipefail
          A=http://127.0.0.1:8080

          # --- bind yang gagal: instance kedua dibunuh pelan oleh gin, bukan rc=0 ---
          set +e
          out=$(/tmp/portfolio-be 2>&1); rc=$?
          set -e
          echo "instance kedua, port 8080 sudah dipakai => rc=$rc"
          echo "$out" | tail -1
          [ "$rc" != "0" ] || { echo "bind gagal tapi keluar nol: container sakit akan terlihat sehat"; exit 1; }
          echo "$out" | grep -qi 'address already in use' || { echo "rc!=0 tapi bukan sebab bind"; exit 1; }

          # --- baseline sehat, di run yang sama, sebelum DB kumatikan ---
          JAR=$(mktemp)
          curl -fsS -c "$JAR" -X POST -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg u "$ADMIN_USER" --arg p "$ADMIN_PASS" '{username:$u,password:$p}')" $A/api/login -o /dev/null
          grep -q 'porto_sesi' "$JAR" || { echo "baseline: login tidak menerbitkan cookie sesi"; exit 1; }
          check() {
            m=$1; p=$2; d=$3; want=$4; args=()
            [ -n "$d" ] && args+=(-H 'Content-Type: application/json' -d "$d")
            # sesi selalu ikut: rute terproteksi harus dinilai sampai menyentuh DB (500), bukan
            # berhenti di 401 karena kurang kredensial
            args+=(-b "$JAR")
            code=$(curl -sS -o /tmp/ckbody -w '%{http_code}' -X "$m" "${args[@]}" "$A$p")
            echo "$m $p => $code :: $(head -c 80 /tmp/ckbody)"
            [ "$code" = "$want" ] || { echo "  harap $want"; fail=1; }
          }
          fail=0
          for p in certificates experience; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$A/api/$p")
            echo "GET /api/$p saat DB hidup => $code"; [ "$code" = "200" ] || fail=1
          done
          [ "$fail" = "0" ] || { echo "baseline sehat gagal, sisa uji tidak berarti"; exit 1; }

          # --- matikan Postgres: kegagalan harus terdengar, bukan disenyapkan ---
          pg=$(docker ps -q --filter ancestor=postgres:15)
          [ -n "$pg" ] || { echo "kontainer postgres service tidak ketemu"; exit 1; }
          docker stop "$pg" > /dev/null
          echo "postgres dimatikan ($pg)"
          sleep 2

          uuid=11111111-1111-4111-8111-111111111111
          check GET /api/certificates '' 500
          check GET /api/experience '' 500
          check POST /api/certificates '{"title":"t","issuer":"i","date":"2026"}' 500
          check POST /api/experience '{"role":"r","company":"c","period":"2026"}' 500
          check DELETE "/api/certificates/$uuid" '' 500
          check DELETE "/api/experience/$uuid" '' 500
          check POST /api/contact '{"name":"audit db mati","email":"audit@example.test","subject":"Audit : db mati","body":"pesan"}' 500
          check GET /api/admin/contact '' 500
          # validasi id terjadi sebelum DB disentuh: tetap 400 walaupun DB sudah mati
          check DELETE /api/certificates/bukan-uuid '' 400
          check DELETE /api/experience/bukan-uuid '' 400

          code=$(curl -sS -o /tmp/ckbody -w '%{http_code}' "$A/api/health")
          echo "GET /api/health saat DB mati => $code :: $(cat /tmp/ckbody)"
          [ "$code" = "503" ] || { echo "health tidak melaporkan db error"; fail=1; }

          [ "$fail" = "0" ] || { echo "ada kegagalan DB yang masih menyamar"; exit 1; }
          echo "semua jalur menjawab kegagalan DB dengan 500/503, tidak ada 200 palsu"

      - name: Log backend saat gagal
        if: failure()
        run: |
          echo "=== stdout/stderr backend ==="
          cat /tmp/be.log || true
          echo "=== tabel di DB ==="
          psql "host=127.0.0.1 user=postgres dbname=portfolio_db" \
            -c '\dt' -c 'select count(*) from certificates;' -c 'select count(*) from contact_messages;' || true

      - name: Hentikan backend
        if: always()
        run: kill "$(cat /tmp/be.pid)" 2>/dev/null || true

  # N1: satu-satunya fitur yang butuh Chromium adalah /api/cv, dan Chromium itu hanya ada di IMAGE
  # frontend (nextjs-frontend/Dockerfile: apk add chromium + PUPPETEER_EXECUTABLE_PATH) — tidak di
  # runner, tidak di `npm run build`-nya job web. Sampai job ini ada, bukti "PDF masih bisa dibuat"
  # baru muncul SETELAH mendarat di produksi: deploy.yml langkah verifikasi 5, atau watch.yml
  # (cv-pdf) kalau produksi sudah sempat rusak. Job ini memindahkan bukti itu ke sebelum merge,
  # dengan men-build Dockerfile yang sama dan membuka hasil PDF-nya betulan.
  #
  # Kenapa assertion harus mengekstrak teks, bukan berhenti di magic byte (diukur di host ini,
  # image yang sama, backend yang sama, hanya jumlah baris sertifikat yang berbeda):
  #   0 baris => /api/cv 200, 778.520 byte, awalan %PDF-
  #   1 baris => /api/cv 200, 783.301 byte, awalan %PDF-
  # Keduanya lulus assertion "200 + %PDF- + ukuran minimum" berapa pun; watch.yml menuntut >=50000.
  # Jadi PDF kosong dan PDF berisi tidak bisa dibedakan dari ukurannya. Yang membedakan cuma
  # teksnya, dan itu yang dituntut di bawah.
  pdf:
    name: pdf
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      pg:
        image: postgres:15
        env:
          POSTGRES_DB: portfolio_pdf
          POSTGRES_USER: postgres
          # trust, seperti job api: tujuannya supaya tidak ada kredensial literal di repo.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.3

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b6 # v5.4.0
        with:
          go-version-file: go-backend/go.mod

      - name: Nilai uji acak, tidak disimpan di repo
        id: fixtures
        run: |
          echo "jwt=$(openssl rand -hex 16)" >> "$GITHUB_OUTPUT"
          echo "adminpass=$(openssl rand -hex 12)" >> "$GITHUB_OUTPUT"

      # Backend melayani satu baris yang judulnya acak. Penanda acak dipakai supaya yang terbukti
      # adalah "data ini lewat ke PDF", bukan "ada teks yang mirip-mirip sertifikat".
      - name: Tanam satu sertifikat penanda, lalu jalankan backend
        id: penanda
        env:
          DATABASE_URL: host=127.0.0.1 user=postgres dbname=portfolio_pdf port=5432 sslmode=disable TimeZone=UTC
          JWT_SECRET: ${{ steps.fixtures.outputs.jwt }}
          ADMIN_PASS: ${{ steps.fixtures.outputs.adminpass }}
        run: |
          set -uo pipefail
          PSQL='host=127.0.0.1 user=postgres dbname=portfolio_pdf port=5432 sslmode=disable'
          cd go-backend
          go build -o /tmp/be-pdf .
          /tmp/be-pdf -migrate

          # Dua secret di atas bukan hiasan: requireEnv untuk JWT_SECRET dan ADMIN_PASS dipanggil
          # sebelum listen (main.go:164 dan :166), jadi melayani tanpa keduanya keluar dengan
          # "JWT_SECRET must be set". -migrate sendiri tidak menyentuh keduanya — itu sebabnya
          # langkah "Skema dibuat eksplisit" di job api boleh menjalankannya tanpa secret.
          # Nama pemakai sengaja tidak diisi: hanya dia yang punya nilai cadangan di backend,
          # dan jalur PDF tidak pernah sampai ke perbandingan login.
          m="ab$(openssl rand -hex 3)"
          psql "$PSQL" -qc "insert into certificates (title, issuer, date, created_at, updated_at) values ('$m', 'penerbit pdf', '2026', now(), now())"
          echo "penanda=$m" >> "$GITHUB_OUTPUT"
          echo "baris sertifikat: $(psql "$PSQL" -tAc 'select count(*) from certificates') dengan judul $m"

          /tmp/be-pdf > /tmp/be-pdf.log 2>&1 &
          echo $! > /tmp/be-pdf.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null 2>&1; then
              echo "backend siap setelah ${i} percobaan"
              exit 0
            fi
            sleep 1
          done
          echo "backend tidak naik dalam 40s:"
          cat /tmp/be-pdf.log
          exit 1

      # BACKEND_URL menentukan ke mana rewrite /api/certificates pergi, dan nilai itu dibakar saat
      # build — bukan dibaca saat kontainer jalan. Ini diukur, bukan disimpulkan: image yang dibangun
      # dengan --build-arg BACKEND_URL=http://porto-be-test:8080 lalu dijalankan TANPA env apa pun
      # tetap menjawab /api/certificates dari dalamnya, dan host itu muncul 9 kali di
      # .next/required-server-files.json. Deploy mengerjakan keduanya (--build-arg lalu
      # --set-env-vars); langkah ini ikut mengirim build arg karena itulah yang dipakai server.
      - name: Build image frontend dari Dockerfile produksi
        run: |
          docker build -t porto-fe:ci --build-arg BACKEND_URL=http://127.0.0.1:8080 nextjs-frontend

      - name: PDF dari image — Chromium nyata, data nyata, bukan cuma magic byte
        env:
          PENANDA: ${{ steps.penanda.outputs.penanda }}
        run: |
          set -euo pipefail
          FE=http://127.0.0.1:3000
          docker run -d --rm --name fe-pdf --network host porto-fe:ci > /dev/null

          code=000
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$FE/cv-layout" || true)" = "200" ]; then
              break
            fi
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "$FE/cv-layout" || true)
          echo "GET /cv-layout => $code (siap setelah $i percobaan)"
          [ "$code" = "200" ] || { echo "image frontend tidak melayani :3000"; docker logs fe-pdf 2>&1 | tail -30; exit 1; }

          curl -fsS "$FE/api/certificates" -o /tmp/sert.json
          sampai=$(jq --arg m "$PENANDA" '[.[].title] | index($m) != null' /tmp/sert.json)
          echo "rewrite fe->be dari DALAM kontainer: $(jq 'length' /tmp/sert.json) baris, memuat penanda: $sampai"
          [ "$sampai" = "true" ] || { echo "penanda tidak sampai ke frontend"; exit 1; }

          code=$(curl -sS -o /tmp/cv.pdf -D /tmp/cv.h -w '%{http_code}' --max-time 180 "$FE/api/cv")
          size=$(wc -c < /tmp/cv.pdf)
          echo "GET /api/cv => $code, $size byte, awalan='$(head -c 5 /tmp/cv.pdf)'"
          [ "$code" = "200" ] || { echo "bukan 200; body: $(head -c 300 /tmp/cv.pdf)"; exit 1; }
          grep -qi '^content-type: application/pdf' /tmp/cv.h || { echo "header bukan application/pdf:"; cat /tmp/cv.h; exit 1; }
          [ "$(head -c 5 /tmp/cv.pdf)" = "%PDF-" ] || { echo "magic byte bukan PDF"; exit 1; }

          # Kriteria selesai perbaikan CV, diukur dari luar — bukan dari narasi. Sebelum langkah
          # ini, tidak ada satu pun job yang menyebut X-CV-Asal (grep di keempat log run #108:
          # 0), jadi klaim "cache 60 detik jalan" cuma punya bukti lokal. Produksi yang lama
          # malah tidak punya lapisan apa pun: dua GET identik berurutan 5,358 s lalu 5,956 s.
          # Sengaja DITEMPATKAN DI SINI, sebelum apt-get install poppler-utils, karena install
          # itu bisa memakan lebih dari 60 detik dan jendela cache-nya per-proses.
          asal1=$(tr -d '\r' < /tmp/cv.h | tr 'A-Z' 'a-z' | sed -n 's/^x-cv-asal: //p' | tr -d ' ')
          t0=$(date +%s%3N)
          code2=$(curl -sS -o /tmp/cv2.pdf -D /tmp/cv2.h -w '%{http_code}' --max-time 180 "$FE/api/cv")
          t1=$(date +%s%3N)
          asal2=$(tr -d '\r' < /tmp/cv2.h | tr 'A-Z' 'a-z' | sed -n 's/^x-cv-asal: //p' | tr -d ' ')
          echo "GET #1 => $code asal=$asal1 ; GET #2 => $code2 asal=$asal2 dalam $((t1 - t0)) ms"
          [ "$asal1" = "render" ] || { echo "GET pertama seharusnya render, dapat '$asal1'"; cat /tmp/cv.h; exit 1; }
          [ "$code2" = "200" ] || { echo "GET kedua bukan 200; body: $(head -c 200 /tmp/cv2.pdf)"; exit 1; }
          [ "$asal2" = "pukulan-cache" ] || { echo "cache tidak bekerja: GET kedua asal='$asal2'"; cat /tmp/cv2.h; docker logs fe-pdf 2>&1 | tail -20; exit 1; }
          cmp -s /tmp/cv.pdf /tmp/cv2.pdf || { echo "yang datang dari cache bukan byte yang sama dengan hasil render"; exit 1; }
          echo "cache CV terbukti: render lalu pukulan-cache, $((t1 - t0)) ms, byte identik ($(wc -c < /tmp/cv2.pdf) byte)"

          # Daftar paket di image runner sudah basi sebelum install dijalankan. Pada run #109
          # (2026-10-12) apt mencoba mengambil pool `libpoppler134 24.02.0-1ubuntu9.9` yang sudah
          # dihapus mirror → 404 → exit 100, padahal seluruh uji PDF di atas baris ini sudah lolos.
          # Index di-refresh dulu supaya URL-nya datang dari daftar yang masih benar.
          command -v pdftotext > /dev/null || { sudo apt-get update -o Acquire::Retries=3 > /dev/null && sudo apt-get install -y --no-install-recommends poppler-utils; }
          command -v pdftotext > /dev/null || { echo "pdftotext tetap tidak tersedia setelah install"; exit 1; }
          pdftotext -layout /tmp/cv.pdf /tmp/cv.txt
          if ! grep -qi "$PENANDA" /tmp/cv.txt; then
            echo "PDF 200 dan $size byte, tapi teksnya tidak memuat penanda $PENANDA"
            echo "=== 40 baris teks PDF ==="; head -40 /tmp/cv.txt
            echo "=== log kontainer ==="; docker logs fe-pdf 2>&1 | tail -20
            exit 1
          fi
          echo "penanda $PENANDA terbaca di teks PDF ($(wc -c < /tmp/cv.txt) byte teks): Chromium di dalam image benar-benar merender data"

          docker rm -f fe-pdf > /dev/null
          echo "fe-pdf dihentikan"

      - name: Log saat gagal
        if: failure()
        run: |
          echo "=== backend ==="
          cat /tmp/be-pdf.log 2>/dev/null || true
          echo "=== frontend ==="
          docker logs fe-pdf 2>&1 | tail -60 || true
          docker ps -a --format '{{.Names}} {{.Status}}' || true

      - name: Hentikan backend
        if: always()
        run: kill "$(cat /tmp/be-pdf.pid)" 2>/dev/null || true
